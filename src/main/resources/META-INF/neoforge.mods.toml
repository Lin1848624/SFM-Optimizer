# NeoForge 1.21.1 模组元数据文件（取代 Forge 1.20.1 的 META-INF/mods.toml）
# 格式参考：https://docs.neoforged.net/docs/gettingstarted/modfiles/
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# 混入配置：NeoForge 会自动从模组元数据里收集并加载
[[mixins]]
config="sfm_optimizer.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sfm"
type="required"
versionRange="[4.34.0,)"
ordering="AFTER"
side="BOTH"
