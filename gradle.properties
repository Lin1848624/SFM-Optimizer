# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties（NeoForge 1.21.1）

# 目标 Minecraft 版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x 对应 Minecraft 1.21.1，版本列表见 https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.252
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod Properties

mod_id=sfm_optimizer
mod_name=Super Factory Manager Optimizer
mod_license=GPLv3
# NeoForge 1.21.1 移植版单独起版本号：1.0.0 = Forge 1.20.1 版，1.1.0 = NeoForge 1.21.1 版
mod_version=1.1.0
mod_group_id=com.sfm_optimizer
mod_authors=Super Factory Manager Optimizer contributors
# 注意：gradle.properties 按 ISO-8859-1 解析，中文必须写成 \uXXXX 转义，否则写进 jar 会变乱码。
mod_description=Super Factory Manager (SFM) optimizer: even-split ROUND ROBIN distribution plus smart sleep and slot memory.
# 依赖的 SFM 版本（NeoForge 1.21.1 版 jar 放入 libs/，见 README.txt）
sfm_version=4.34.0
# ModDevGradle 构建 Minecraft 1.21.1 需要 Java 21
